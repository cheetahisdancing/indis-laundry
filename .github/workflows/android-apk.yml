# GitHub 서버(Ubuntu)에서 안드로이드 앱(APK)을 빌드합니다.
# 빌드가 끝나면
#  1) Actions 결과(Artifacts)에 Indis-android 로 남기고
#  2) Releases의 'android-latest'에 Indis.apk를 올려서
#     휴대폰에서 바로 받을 수 있는 고정 링크를 만듭니다.
name: Android APK Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Indis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Indis-android
          path: Indis.apk

      - name: Publish to Releases (android-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest Indis.apk \
            --target "$GITHUB_SHA" \
            --title "인디스 안드로이드 앱 (최신 빌드)" \
            --notes "브랜치 ${GITHUB_REF_NAME} · 커밋 ${GITHUB_SHA::7} 에서 자동으로 빌드한 APK예요. 휴대폰에서 Indis.apk를 눌러 설치하세요."
